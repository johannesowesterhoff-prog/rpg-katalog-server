# Deployt den aktuellen Stand von main auf Google Cloud Run (Dienst
# rpg-katalog, Region us-east1) – automatisch nach jedem Merge auf main oder
# per Knopf unter „Actions → Deploy auf Google Cloud Run → Run workflow“.
#
# Voraussetzung: Repository-Secret GCP_SA_KEY mit dem JSON-Schlüssel des
# Dienstkontos claude-deploy (GitHub → Settings → Secrets and variables → Actions).
name: Deploy auf Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deployen
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::Secret GCP_SA_KEY fehlt (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          bash scripts/deploy-gcp.sh
      - name: Live-Seite prüfen
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://rpg-katalog-666839148899.us-east1.run.app/api/games)
          echo "/api/games → $code"
          [ "$code" = 200 ]
